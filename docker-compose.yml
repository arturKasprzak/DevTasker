services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: DevTasker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  devtasker-api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=DevTasker;Username=postgres;Password=admin123

volumes:
  postgres_data: